<div class="single-select">
  <mat-form-field class="single-select__field">
    <mat-label>{{name()}}</mat-label>
    <mat-select
                [formControl]="formControl">
      @for (item of items(); track item.id) {
      <mat-option [value]="item.id">{{item.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
