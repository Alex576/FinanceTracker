<div class="select-switch">
  @if (isMulti()){
  <app-multi-select [control]="control()"
                    (valueChanged)="onValueChanged($event)"
                    (validChanged)="onValidChanged($event)" />
  }
  @else {
  <app-single-select [control]="control()"
                     (valueChanged)="onValueChanged($event)"
                     (validChanged)="onValidChanged($event)" />
  }
</div>
